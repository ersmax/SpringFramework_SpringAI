# Section 11 and Section 16
# This section allows to configure PostgreSQL to use in SpringJDBC
# You have to mention the IP server address and the server port number
# Connection URL Format: jdbc:postgresql://hostname:port/database_name
# hostname: server address (localhost for local machine)
# port: PostgreSQL port (default: 5432)
# database_name: name of your database
#spring.datasource.url=jdbc:postgresql://localhost:5432/demo
#spring.datasource.username=postgres
#spring.datasource.password=password
#spring.datasource.driver-class-name=org.postgresql.Driver

# old Section 11 and first part of Section 16
# This file sets up the path for the H2 schema in Section 11 and Section 16
spring.application.name=demo
#spring.sql.init.mode=always
#spring.sql.init.schema-locations=classpath:Section11/schema.sql
#spring.sql.init.data-locations=classpath:Section11/data.sql

# Section 12
# Configure location and extension of View technology (JSP) for proper mapping
# with the Controller (servlets)
#spring.mvc.view.prefix = /Section12/
#spring.mvc.view.suffix = .jsp

# Section 14
# Configure prefix and suffix for the Job Posting Web app
spring.mvc.view.prefix = /Section14/views/
spring.mvc.view.suffix = .jsp


# Section 16
# In addition to the lines below, you add a new line
# to tell Spring Hibernate to create a table for us
spring.datasource.url=jdbc:postgresql://localhost:5432/demo
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql=true